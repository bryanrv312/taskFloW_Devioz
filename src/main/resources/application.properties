# ==========================================
# CONFIGURACIÓN DEL SERVIDOR
# ==========================================
server.port=8080
server.address=0.0.0.0
server.error.include-message=always
server.error.include-binding-errors=always

# ==========================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ==========================================
spring.application.name=taskflow

# ==========================================
# BASE DE DATOS MYSQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3307/taskflow2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# CONFIGURACIÓN JWT
# ==========================================
# Clave secreta en Base64 (al menos 256 bits para HMAC-SHA256)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Tiempo de expiración en milisegundos (24 horas = 86400000 ms)
jwt.expiration-ms=86400000

# ==========================================
# SWAGGER / OPENAPI 3
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
